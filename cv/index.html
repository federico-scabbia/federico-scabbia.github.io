<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV — Federico Scabbia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; font-family: 'Segoe UI', sans-serif; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: #1a1a1a;
      color: #fff;
      font-size: 0.9rem;
    }
    .toolbar a {
      color: #e0c9b8;
      text-decoration: none;
      font-weight: 600;
    }
    .toolbar a:hover { text-decoration: underline; }
    .pdf-container { flex: 1; }
    .pdf-container object,
    .pdf-container iframe { width: 100%; height: 100%; border: none; }
    .fallback {
      display: none;
      text-align: center;
      padding: 60px 20px;
    }
    .fallback a {
      display: inline-block;
      padding: 12px 28px;
      background: #8b2500;
      color: #fff;
      text-decoration: none;
      border-radius: 4px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span>Federico Scabbia — Curriculum Vitae</span>
    <span>
      <a href="/files/CV_Federico_Scabbia.pdf" download>Download PDF</a>
      &nbsp;&middot;&nbsp;
      <a href="/">Back to site</a>
    </span>
  </div>
  <div class="pdf-container">
    <object data="/files/CV_Federico_Scabbia.pdf" type="application/pdf">
      <iframe src="/files/CV_Federico_Scabbia.pdf">
        <div class="fallback" style="display:block;">
          <p style="margin-bottom:20px;">Your browser cannot display the PDF inline.</p>
          <a href="/files/CV_Federico_Scabbia.pdf" download>Download CV (PDF)</a>
        </div>
      </iframe>
    </object>
  </div>
</body>
</html>
